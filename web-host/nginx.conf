# Browser build of Grabium TV plus a same-origin proxy of the public edge.
# Same origin matters: the edge's /api and /platform routes send no CORS
# headers, and the platform's refresh cookie is scoped to /platform/auth.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /health { return 200 "ok\n"; }

    location = / {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location ~ ^/(api|cam|platform|assets)/ {
        proxy_pass https://play.freeskillclaw.cc;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name play.freeskillclaw.cc;
        proxy_set_header Host play.freeskillclaw.cc;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        # Live HLS and WHEP answers stream; do not hold them in a buffer.
        proxy_buffering off;
        client_max_body_size 256k;
    }

    location /ws/ {
        proxy_pass https://play.freeskillclaw.cc;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name play.freeskillclaw.cc;
        proxy_set_header Host play.freeskillclaw.cc;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / { return 404; }
}
